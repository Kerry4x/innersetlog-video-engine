function act(t) {
  const ts = K.stepTime(t);
  // ---- Nathan: tells the story with his hands, steps in, says the line, holds still ----
  const telling = ramp(ts, 3.6, 3.9) * (1 - ramp(ts, 7.6, 7.9)), cup = ramp(ts, 5.0, 5.4) * (1 - ramp(ts, 7.3, 7.7));

  const lean = ramp(ts, 5.0, 5.6) * (1 - ramp(ts, 7.5, 8));
  nathan.g.rotation.x = 0.06 * lean;
  const pointK = ramp(ts, 10.6, 11.0);
  if (ts > 10.4) { nR.pose({ fwd: lerp(0.3, -1.2, pointK), out: lerp(0.3, 2.0, pointK), bend: lerp(0.6, 0.05, pointK), point: pointK > 0.5 }); /* up and across, at David's face */ nL.pose({ fwd: 0.2, out: 0.15, bend: 0.3 }); }

  nathan.P.head.rotation.y = 0.25 + 0.12 * Math.sin(ts * 1.3) * telling;

  king.g.rotation.x = 0.06 * drawnIn + 0.12 * anger - 0.08 * drain;

  // judges with the hand nearest Nathan; the other fist clenches on the lion armrest

function update(t) {

  } else {
    useScene(room); act(t);
    const k = (a, b) => (t - a) / (b - a);
    if (t < S[2]) { const u = k(S[1], S[2]); pos = V(-0.3, 1.65, 6.4).lerp(V(0.35, 1.55, 5.7), u); tgt = V(0, 1.3, 0); focusPt = V(0, 1.2, 0.1); }

    else if (t < S[4]) { const u = k(S[3], S[4]); pos = V(0.2, 1.5, 4.3).lerp(V(0.05, 1.5, 3.95), u); tgt = V(-0.1, 1.3, 0.2); focusPt = V(-0.45, 1.35, 0.3); }
    else { const u = k(S[4], S[5]); pos = V(0.85, 1.52, 2.35).lerp(V(0.68, 1.48, 2.0), u); tgt = V(0.5, 1.38, 0); focusPt = V(0.52, 1.4, 0.05); }
  }

  camera.position.copy(pos); camera.lookAt(tgt);

}
