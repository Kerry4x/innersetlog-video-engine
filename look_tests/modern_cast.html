<!doctype html>
<html><head><meta charset="utf-8"><title>Modern cast</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><canvas id="out" width="1080" height="1920"></canvas>
<script type="module">
// The modern cast of the David short (52-90 s), for approval: front and side profile in a neutral clay studio.
//   ?view=front|side  &ss=1|2
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { buildCharacter, clay, M } from './kit/claychar.js';
const Q = new URLSearchParams(location.search), W = 1080, H = 1920, SS = +(Q.get('ss') || 2), RW = W * SS, RH = H * SS, SIDE = Q.get('view') === 'side';
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2a2420');
{ const g = new THREE.Mesh(new THREE.PlaneGeometry(14, 8), clay('#cbb497', { roughness: 0.95 })); g.rotation.x = -Math.PI / 2; scene.add(g);
  const b = new THREE.Mesh(new THREE.PlaneGeometry(14, 6), clay('#b39a7c', { roughness: 0.95 })); b.position.set(0, 3, -2.2); scene.add(b); }
const cast = [
  { name: 'you', skin: '#b9734a', hair: '#2a1c14', browC: '#2a1c14', bald: false, hairline: 0.04, tunic: '#c9952e', trim: '#a87a22', pants: '#2f3a52', shoes: '#ece6da', lidTop: +(Q.get('lt') || 0.26) },
  { name: 'friend', skin: '#d39a6e', hair: '#3a2418', browC: '#3a2418', bald: false, hairStyle: 'long', nose: 0.72, lips: '#a84a4e', browW: 0.6, earrings: '#d6a640', tunic: '#7c8f6a', trim: '#62744f', pants: '#6a4a5a', shoes: '#e9e0d0', lidTop: 0.24 },
  { name: 'confronter', skin: '#8a5636', hair: '#1a1210', browC: '#1a1210', bald: false, beard: '#3a2618', beardLen: -0.02, beardDepth: 1.15, glasses: '#2a2a2a', tunic: '#2f6f74', trim: '#245a5e', pants: '#3a3a3a', shoes: '#4a3a2a', lidTop: 0.26 }];
const WHO = +(Q.get('who') || 0);
const chars = cast.filter((c, i) => i === WHO).map((c, i) => { const ch = buildCharacter({ outfit: 'modern', ...c }); ch.root.position.set(0, 0, 0); ch.root.rotation.y = SIDE ? Math.PI / 2 : 0; scene.add(ch.root);
  ch.setArm('L', { fwd: 0.05, out: 0.14, bend: 0.25, curl: 0.4 }); ch.setArm('R', { fwd: 0.05, out: 0.14, bend: 0.25, curl: 0.4 }); ch.setFace({ lid: -0.08, raise: 0.4, soft: +(Q.get('soft') || 1.0), smile: 1, look: [0, 0] }); /* neutral, pleasant */ ch.solve(); return ch; });
scene.add(new THREE.HemisphereLight('#ffe6c8', '#3a2a1c', 0.45));
const key = new THREE.SpotLight('#fff0dc', 70, 16, Math.PI / 6, 0.9, 1.4); key.position.set(-2.5, 4.2, 4.5); key.target.position.set(0, 1.2, 0); key.castShadow = true; key.shadow.mapSize.set(4096, 4096); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.012; key.shadow.radius = 8; scene.add(key, key.target);
const rimL = new THREE.SpotLight('#ffd8a8', 25, 10, 0.5, 0.8, 1.5); rimL.position.set(2.5, 3.5, -2.0); rimL.target.position.set(0, 1.5, 0); scene.add(rimL, rimL.target);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 40); camera.position.set(0, 1.3, 4.9); camera.lookAt(0, 1.08, 0);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(RW, RH, { samples: 4, type: THREE.HalfFloatType })); composer.addPass(new RenderPass(scene, camera));
const ao = new GTAOPass(scene, camera, RW, RH); ao.updateGtaoMaterial({ radius: 0.25, samples: 24 }); composer.addPass(ao); composer.addPass(new OutputPass());
const out = document.getElementById('out'); out.width = RW; out.height = RH; const o = out.getContext('2d');
window.drawFrame = () => { composer.render(); o.drawImage(renderer.domElement, 0, 0, RW, RH); return out.toDataURL('image/png'); };
window.READY = true;
</script></body></html>
