const city = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#6f8fb8'); gr.addColorStop(0.55, '#f2c08a'); gr.addColorStop(1, '#f7d9a8');

}

}
{

  houseSpots.forEach((s, i) => {
    const y = hill(s.x, s.z); q.setFromEuler(new THREE.Euler(0, s.ry, 0));
    m.compose(V(s.x, y + s.h / 2 - 0.03, s.z), q, V(s.w, s.h, s.d)); houses.setMatrixAt(i, m); houses.setColorAt(i, tones[i % tones.length]);
    const off = V(0, 0, s.d / 2 + 0.005).applyQuaternion(q);
    m.compose(V(s.x + off.x, y + 0.06, s.z + off.z), q, V(0.07, 0.13, 0.02)); doors.setMatrixAt(i, m);
  });
  const rugs = new THREE.InstancedMesh(new RoundedBoxGeometry(1, 1, 1, 1, 0.3), clay('#ffffff'), n), wins = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), C.hairDark, n * 2);
  const rugTones = ['#b0402e', '#2f5f8f', '#d39a2a', '#6b7a3a', '#8a3a6a'].map(c => new THREE.Color(c)); let rk = 0;
  houseSpots.forEach((s, i) => {
    const y = hill(s.x, s.z); q.setFromEuler(new THREE.Euler(0, s.ry, 0));
    for (const side of [-1, 1]) { const off = V(side * (s.w / 2 + 0.004), s.h * 0.62, 0).applyQuaternion(q); m.compose(V(s.x + off.x, y + off.y, s.z + off.z), q, V(0.01, 0.06, 0.06)); wins.setMatrixAt(i * 2 + (side > 0 ? 1 : 0), m); }
    if (rand() < 0.3) { m.compose(V(s.x + (rand() - 0.5) * s.w * 0.4, y + s.h + 0.0, s.z + (rand() - 0.5) * s.d * 0.4), q, V(s.w * 0.45, 0.025, s.d * 0.35)); rugs.setMatrixAt(rk, m); rugs.setColorAt(rk++, rugTones[rk % rugTones.length]); }

}

// trees: cypress inside and around, olives on the outer slopes
{
  const cyp = new THREE.InstancedMesh(lumpy(new THREE.ConeGeometry(0.11, 0.62, 12, 6), 0.02, 8, 'radial'), C.cypress, 110);
  const oli = new THREE.InstancedMesh(lumpy(new THREE.SphereGeometry(0.22, 16, 12), 0.04, 6), C.olive, 140);
  const m = new THREE.Matrix4(); let k = 0;
  for (let i = 0; i < 400 && k < 110; i++) {
    const a = rand() * 6.283, r = 2 + rand() * 8, x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.abs(r - 6.1) < 0.45 || houseSpots.some(s => Math.hypot(s.x - x, s.z - z) < 0.36)) continue;
    const s = 0.8 + rand() * 0.6; m.compose(V(x, hill(x, z) + 0.3 * s, z), new THREE.Quaternion(), V(s, s, s)); cyp.setMatrixAt(k++, m);

  for (let i = 0; i < 400 && k < 140; i++) {

    m.compose(V(x, hill(x, z) + 0.15 * s, z), new THREE.Quaternion(), V(s, s * 0.8, s)); oli.setMatrixAt(k++, m);

}
// tiny people in the street (they bob on 2s)
const crowdN = 70, crowdBody = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.03, 0.07, 4, 8), clay('#ffffff'), crowdN), crowdHead = new THREE.InstancedMesh(new THREE.SphereGeometry(0.027, 10, 8), C.skin, crowdN);
const crowd = [];
for (let i = 0; i < crowdN; i++) { const z = 0.9 + rand() * 4.8, x = (rand() - 0.5) * 0.45; crowd.push({ x, z, ph: rand() * 6 }); crowdBody.setColorAt(i, new THREE.Color(['#8a6544', '#5b6f8a', '#a04a3a', '#d8c7a5', '#6a7a4a'][i % 5])); }
crowdBody.castShadow = true; city.add(crowdBody, crowdHead);
function updateCrowd(ts) {
  const m = new THREE.Matrix4();
  crowd.forEach((p, i) => {
    const zz = p.z - ((ts * 0.12 + p.ph) % 0.6) * (i % 2 ? 1 : -1), y = hill(p.x, zz), b = Math.abs(Math.sin(ts * 9 + p.ph)) * 0.012;
    m.makeTranslation(p.x, y + 0.065 + b, zz); crowdBody.setMatrixAt(i, m); m.makeTranslation(p.x, y + 0.15 + b, zz); crowdHead.setMatrixAt(i, m);
  });

}
city.add(new THREE.HemisphereLight('#bcd0ff', '#6a4a2a', 0.5));
{

  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 }); sun.shadow.bias = -0.0005; city.add(sun);
}

// =====================================================================================
// SHOTS 2–3 · the throne room

const room = new THREE.Scene();
room.background = new THREE.Color('#3a2a1f'); room.fog = new THREE.Fog('#3a2a1f', 10, 20);
{
  const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
  g.fillStyle = '#4e3b2c'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { const v = 150 + rand() * 40; g.fillStyle = `rgb(${v},${v * 0.8},${v * 0.62})`; g.beginPath(); g.roundRect(i * 128 + 6 + rand() * 4, j * 128 + 6 + rand() * 4, 114, 114, 18); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3); t.colorSpace = THREE.SRGBColorSpace;
  const floor = mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshPhysicalMaterial({ map: t, bumpMap: t, bumpScale: 3, roughness: 0.85, sheen: 0.2 }), false); floor.rotation.x = -Math.PI / 2; room.add(floor);
}
const wall = mesh(lumpy(new THREE.BoxGeometry(12, 6, 0.3, 60, 30, 2), 0.03, 1.5), C.wall, false); wall.position.set(0, 3, -1.9); room.add(wall);
{
  const s = new THREE.Shape(); s.moveTo(-0.45, 0); s.lineTo(-0.45, 1.1); s.absarc(0, 1.1, 0.45, Math.PI, 0, true); s.lineTo(0.45, 0); s.lineTo(-0.45, 0);
  const win = new THREE.Mesh(new THREE.ShapeGeometry(s, 24), new THREE.MeshBasicMaterial({ color: '#ffdca8' })); win.position.set(-1.1, 1.9, -1.74); room.add(win);
  for (const x of [-0.15, 0.15]) { const bar = mesh(lumpy(new THREE.CapsuleGeometry(0.035, 1.5, 4, 8), 0.01, 6), C.wood); bar.position.set(-1.1 + x, 2.65, -1.7); room.add(bar); }
  for (const x of [-2.4, 2.4]) { const col = mesh(lumpy(new THREE.CylinderGeometry(0.26, 0.3, 6, 32, 30), 0.03, 2.5, 'radial'), C.wall); col.position.set(x, 3, -1.5); room.add(col); }
}
// king on the throne
const kingG = new THREE.Group(); kingG.position.set(0.55, 0, -0.1); kingG.rotation.y = -0.25; room.add(kingG);
{
  const seat = mesh(lumpy(new RoundedBoxGeometry(0.95, 0.45, 0.7, 4, 0.08), 0.015, 3), C.throne); seat.position.set(0, 0.225, -0.05); kingG.add(seat);
  const back = mesh(lumpy(new RoundedBoxGeometry(0.95, 1.75, 0.18, 4, 0.07), 0.02, 2.5), C.throne); back.position.set(0, 1.075, -0.42); kingG.add(back);
  for (const s of [-1, 1]) { const k = blob(0.08, C.gold, 0.006, 16); k.position.set(0.42 * s, 2.0, -0.42); kingG.add(k); }
  for (const s of [-1, 1]) {
    const thigh = mesh(lumpy(new THREE.CapsuleGeometry(0.1, 0.22, 6, 12), 0.008, 8), C.kingRobe); thigh.rotation.x = Math.PI / 2; thigh.position.set(0.13 * s, 0.52, 0.2); kingG.add(thigh);
    const shin = mesh(lumpy(new THREE.CapsuleGeometry(0.09, 0.3, 6, 12), 0.008, 8), C.kingRobe); shin.position.set(0.13 * s, 0.27, 0.36); kingG.add(shin);
    const foot = blob(0.08, C.wood, 0.006, 14); foot.scale.set(1, 0.6, 1.5); foot.position.set(0.13 * s, 0.05, 0.43); kingG.add(foot);
  }
}
const king = K.character({ robeMat: C.kingRobe, robeH: 0.72, robeR: 0.33, hair: C.hairDark, crown: true, beard: [[0, -0.29, 0.12, 0.1], [0.1, -0.24, 0.12, 0.075], [-0.1, -0.24, 0.12, 0.075]] });
king.g.position.y = 0.45; kingG.add(king.g);
{ const sash = mesh(lumpy(new THREE.TorusGeometry(0.29, 0.03, 10, 40), 0.006, 8), C.sash); sash.rotation.x = Math.PI / 2; sash.position.y = 0.42; king.g.add(sash); }
// Nathan
const nathan = K.character({ robeMat: C.prophetRobe, robeH: 1.12, robeR: 0.36, hair: C.hairGray, beard: [[0, -0.2, 0.17, 0.14], [0.1, -0.15, 0.17, 0.1], [-0.1, -0.15, 0.17, 0.1], [0, -0.32, 0.12, 0.11]] });
nathan.g.position.set(-0.55, 0, 0.3); nathan.g.rotation.y = 0.5; room.add(nathan.g); nathan.P.mouth.visible = false;
const [nL, nR] = nathan.P.arms; nL.sh.rotation.set(-0.45, 0, -0.2);
{ const staff = mesh(lumpy(new THREE.CylinderGeometry(0.03, 0.035, 1.75, 12, 20), 0.008, 6, 'radial'), C.wood); staff.position.set(-0.33, 0.87, 0.3); nathan.g.add(staff);
  const finger = blob(0.025, C.skin, 0.003, 10); finger.scale.y = 2.4; finger.position.y = -0.55; nR.sh.add(finger); }
// the parable as a flat paper cutout (2D inside the 3D world)
const memMat = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.beginPath(); for (let i = 0; i <= 64; i++) { const a = i / 64 * Math.PI * 2, r = 228 + (rand() - 0.5) * 14; g[i ? 'lineTo' : 'moveTo'](256 + Math.cos(a) * r, 256 + Math.sin(a) * r); }
  g.closePath(); g.fillStyle = '#efe1c2'; g.fill(); g.lineWidth = 7; g.strokeStyle = '#4a3020'; g.stroke();

  g.fillStyle = '#d6a074'; g.beginPath(); g.arc(237, 212, 36, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#fbf6ea'; for (const [x, y, r] of [[300, 290, 30], [328, 280, 26], [276, 280, 24], [302, 262, 24], [326, 304, 22]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.stroke(); }

  g.beginPath(); g.moveTo(258, 300); g.quadraticCurveTo(300, 330, 330, 300); g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;

const memory = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 1.15), memMat); memory.position.set(-0.02, 2.2, 0.55); room.add(memory);
// light, plus a visible god ray through the window and dust in it
room.add(new THREE.HemisphereLight('#ffe7cc', '#3a281c', 0.55));
{

const composer = new EffectComposer(renderer); composer.setSize(W, H);

const useScene = s => { renderPass.scene = s; bokeh.scene = s; };

// =====================================================================================
// direction: the camera always moves (smooth); characters act on 2s
// =====================================================================================
function update(t) {
  const ts = K.stepTime(t);
  let pos, tgt, focusPt, aperture = 0.0022, maxblur = 0.006;
  if (t < CUT1) { // aerial push over the city toward the palace
    useScene(city); updateCrowd(ts);
    const k = ease(t / CUT1);
    pos = V(7.5, 8.5, 13).lerp(V(3.0, 4.2, 6.8), k); tgt = V(0, 0.8, 0).lerp(V(0.2, 1.4, -0.2), k);
    focusPt = V(0.4, 2.0, -0.3); aperture = 0.0045; maxblur = 0.012;

    useScene(room);

    const breath = Math.sin(ts * 2.2) * 0.012; king.P.body.scale.y = 1 + breath; nathan.P.body.scale.y = 1 - breath;
    nathan.P.head.rotation.y = 0.15 * Math.sin(ts * 1.4) * (1 - ramp(ts, 5.6, 5.9));
    king.P.head.rotation.z = 0.06 * ramp(ts, 3.7, 4.4) * (1 - ramp(ts, 6.6, 6.9));
    const pt = ramp(ts, 5.8, 6.25); nR.sh.rotation.set(lerp(-0.1, -0.35, pt), 0, lerp(0.15, 1.45, pt));

    king.P.arms.forEach((a, i) => { a.sh.rotation.x = lerp(-0.75, -1.1, r); a.sh.rotation.z = (i ? 1 : -1) * lerp(0.18, 0.35, r); });
    const mi = ramp(ts, 3.6, 4.1) * (1 - ramp(ts, 5.4, 5.8)); memMat.opacity = mi; memory.rotation.z = 0.04 * Math.sin(ts * 3); memory.position.y = 2.2 + 0.03 * Math.sin(ts * 2);
    king.g.rotation.z = 0.004 * K.boil(t, 1); nathan.g.rotation.z = 0.004 * K.boil(t, 2);
    dust.rotation.y = t * 0.03;
    if (t < CUT2) { // slow arc across the room
      const k = (t - CUT1) / (CUT2 - CUT1);
      pos = V(-0.8, 1.65, 6.6).lerp(V(0.45, 1.5, 5.9), k); tgt = V(-0.1, 1.25, 0).lerp(V(0.1, 1.3, 0), k); focusPt = V(0, 1.2, 0.1);
    } else { // close on David, still drifting in

    }
  }
  camera.position.copy(pos); camera.lookAt(tgt);

}
