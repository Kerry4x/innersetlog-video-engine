  for (const fwd of (i ? [-0.4, -0.3, -0.2, -0.1, 0, 0.1] : [-0.1, 0, 0.1, 0.2, 0.3])) for (const out of (i ? [0.31, 0.38, 0.45, 0.52] : [0.17, 0.24, 0.31, 0.38])) for (const bend of [1.3, 1.45, 1.6, 1.75, 1.9]) for (const wrist of [-0.5, -0.3, -0.1, 0.1]) {
    david.setArm(side, { fwd, out, bend, wrist, curl: 0.6 }); david.root.updateMatrixWorld(true);
    const pen = qc({ chars: [a.sh], world: [throne], ignore: [david.root], pairs: false, tol: 0.006 }).issues.reduce((m, h) => Math.max(m, h.depth), 0);
    if (pen > 0.02) continue;
    const H = a.hand.g.getWorldPosition(new THREE.Vector3()), g = gap(a.hand.g, rests[i]), off = Math.hypot(H.x - L.x, H.z - L.z); /* contact with the wood itself, not the top of the mane */
    const score = pen * 20 + Math.max(0, g - 0.006) * 10 + off;
    if (score < best[0]) best = [+score.toFixed(3), fwd, out, bend, wrist, +pen.toFixed(3), g, +off.toFixed(3)]; }
  return best; };
window.GAZE = () => { const r = []; for (const [who, tgt] of [[david, nathan], [nathan, david]]) { const T = tgt.head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0.3, 0)); for (const e of who.eyes) { const c = e.aim.getWorldPosition(new THREE.Vector3()), p = e.aim.children[0].getWorldPosition(new THREE.Vector3()); const d = p.sub(c).normalize(), w = T.clone().sub(c).normalize(); r.push([who === david ? "david" : "nathan", e.s, +(Math.acos(Math.min(1, d.dot(w))) * 57.3).toFixed(1), +(Math.atan2(d.x, d.z) * 57.3).toFixed(0), +(Math.atan2(w.x, w.z) * 57.3).toFixed(0)]); } } { const a = nathan.arms[1], e = a.el.getWorldPosition(new THREE.Vector3()), w = a.wr.getWorldPosition(new THREE.Vector3()), T = david.head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0.3, 0)); const d = w.clone().sub(e).normalize(), t = T.sub(w).normalize(); r.push(["point", +(Math.acos(Math.min(1, d.dot(t))) * 57.3).toFixed(1)]); } return r; };
window.OCC = (x, y, z) => { const P = new THREE.Vector3(x, y, z), out = []; scene.traverse(L => { if (!L.isLight || !L.castShadow) return; const lp = L.getWorldPosition(new THREE.Vector3()); let dir; if (L.isDirectionalLight) dir = lp.clone().sub(L.target.getWorldPosition(new THREE.Vector3())).normalize(); else dir = lp.clone().sub(P).normalize(); const rc = new THREE.Raycaster(P.clone().addScaledVector(dir, 0.02), dir); const h = rc.intersectObjects(scene.children, true).filter(h => h.object.isMesh && h.object.castShadow && !h.object.material.transparent)[0]; out.push([L.type, L.intensity, lp.toArray().map(v => +v.toFixed(2)), h ? [h.object.geometry.type, h.object.material.color?.getHexString(), +h.distance.toFixed(3), h.point.toArray().map(v => +v.toFixed(2))] : null]); }); return out; };
window.DBG = () => { const cols = ["#ff0000","#00ff00","#0000ff","#ffff00","#ff00ff","#00ffff","#ffffff","#ff8800","#000000","#888888"]; const out = []; [...david.body.children, ...david.root.children].forEach((o, i) => { if (o.isMesh && ["5b3591","6a4426","8a5a34"].includes(o.material.color?.getHexString())) { o.material = o.material.clone(); o.material.color.set(cols[out.length % 10]); out.push([i, o.geometry.type, cols[out.length % 10]]); } }); return out; };
window.PICK = (x, y) => { const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(x, y), camera); return rc.intersectObjects(scene.children, true).filter(h => h.object.isMesh && !h.object.material.transparent).slice(0, 3).map(h => { const o = h.object, wp = o.getWorldPosition(new THREE.Vector3()); return [o.geometry.type, o.geometry.attributes.position.count, o.material.color?.getHexString(), o.material.side, wp.toArray().map(v => +v.toFixed(3)), h.point.toArray().map(v => +v.toFixed(3)), o.parent?.type, o.parent?.children.indexOf(o)]; }); };
window.HANDPOS = () => [0, 1].map(i => nathan.arms[i].hand.g.getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(3)));
window.PREP = (t = 0) => { if (window.POSE) window.POSE(t); applyCam(camAt(t) || { name: SHOT, t0: -1, k: 0 }); david.solve(); nathan.solve(); }; /* pose + camera + collision solve, no render (for checks) */
