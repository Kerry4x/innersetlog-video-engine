    fill(g, '#a07a52', [[w * 0.3, h * 0.66], [w * 0.52, h * 0.64], [w * 0.54, h * 0.8], [w * 0.32, h * 0.82]]); for (const x of [0.33, 0.4, 0.47]) fill(g, '#6a4a2c', [[w * x, h * 0.65], [w * (x + 0.012), h * 0.65], [w * (x + 0.012), h * 0.81], [w * x, h * 0.81]]);

poor.position.set(-0.27, 0.3, 0);
const LAMB_SEAT = new THREE.Vector3((0.56 - 0.22) * 0.17, -(0.54 - 0.06) * 0.2, 0); /* top of his forearm, in arm coordinates */
/* the lamb: pivot at its feet; held by the scruff it hangs 0.1 m below the fist */
const lamb = new THREE.Group(); stage.add(lamb);
const lambPieces = ['calm', 'shock'].map(e => piece(0.17, 0.14, [0.5, 0.95], (g, w, h) => { sheep(g, w, h); if (e === 'shock') { ell(g, '#fbf7ee', w * 0.15, h * 0.38, w * 0.042, h * 0.048); ell(g, '#111', w * 0.15, h * 0.38, w * 0.017, h * 0.02); } }, { rim: 6 }));
lambPieces.forEach((pp, i) => { pp.visible = i === 0; lamb.add(pp); });
/* the rich man: wide, red robe with a gold sash, collar and hem, rings, turban, pointed beard; faces left */
const rich = puppet({ z: 0.025, dir: -1, neck: [-0.02, 0.52, 0], shoulder: [-0.06, 0.47, 0],
  body: [0.34, 0.74, [0.5, 1], (g, w, h) => { fill(g, '#8e2a32', [[w * 0.12, h], [w * 0.02, h * 0.62, w * 0.1, h * 0.36, w * 0.36, h * 0.3], [w * 0.7, h * 0.27, w * 0.96, h * 0.4, w * 0.92, h]]);
    shade(g, 'rgba(255,170,150,0.18)', w * 0.35, h * 0.5, w * 0.2, h * 0.15);
    fill(g, '#d6a640', [[w * 0.03, h * 0.6], [w * 0.95, h * 0.59], [w * 0.95, h * 0.63], [w * 0.03, h * 0.64]]); ell(g, '#d6a640', w * 0.2, h * 0.62, w * 0.035, h * 0.03);
    fill(g, '#d6a640', [[w * 0.1, h * 0.94], [w * 0.92, h * 0.93], [w * 0.92, h * 0.97], [w * 0.1, h * 0.98]]); fill(g, '#d6a640', [[w * 0.3, h * 0.31], [w * 0.5, h * 0.36, w * 0.66, h * 0.3], [w * 0.64, h * 0.35], [w * 0.5, h * 0.4, w * 0.32, h * 0.35]]); }],
  heads: ['back', 'sly'].map(e => [0.24, 0.27, [0.4, 0.92], (g, w, h) => profileHead(g, w, h, { beard: 'point', beardC: '#6e4c32', cloth: 'turban', clothC: '#efe3c9', eye: e, nose: 1.15, faceRight: false })]),
  /* near arm: a long sleeve to a ringed fist; pivot at the shoulder, pointing left */
  armNear: [0.29, 0.12, [0.9, 0.25], (g, w, h) => { fill(g, '#7a222a', [[w * 0.98, h * 0.05], [w * 0.7, 0, w * 0.4, h * 0.12, w * 0.16, h * 0.3], [w * 0.1, h * 0.66], [w * 0.4, h * 0.62, w * 0.7, h * 0.52, w * 0.98, h * 0.62]]);
    fill(g, '#d6a640', [[w * 0.12, h * 0.28], [w * 0.19, h * 0.26], [w * 0.21, h * 0.66], [w * 0.13, h * 0.7]]); ell(g, SKIN, w * 0.07, h * 0.48, w * 0.07, h * 0.24); ell(g, '#d6a640', w * 0.08, h * 0.62, w * 0.022, h * 0.06); }],
  armFar: [0.2, 0.2, [0.85, 0.1], (g, w, h) => { fill(g, '#6e1e26', [[w * 0.95, h * 0.05], [w * 0.7, 0, w * 0.6, h * 0.35, w * 0.55, h * 0.5], [w * 0.4, h * 0.6, w * 0.25, h * 0.62, w * 0.15, h * 0.6], [w * 0.15, h * 0.75], [w * 0.4, h * 0.8, w * 0.75, h * 0.72, w * 0.95, h * 0.4]]); ell(g, SKIN_D, w * 0.12, h * 0.67, w * 0.08, h * 0.08); }] });
rich.position.set(0.36, 0.3, 0);
const FIST = new THREE.Vector3((0.07 - 0.9) * 0.29, -(0.48 - 0.25) * 0.12, 0), FIST_ANGLE = Math.atan2(FIST.y, FIST.x); /* fist in arm coordinates */

sky.userData.mesh.receiveShadow = false; /* painted backdrop: shadows of near pieces would read as smudges in the sky */
// ---------- light: warm key from the upper left (like the window in the throne room), soft fill, rim from behind ----------
scene.add(new THREE.HemisphereLight('#ffe7c8', '#4a3218', 0.8));
const key = new THREE.SpotLight('#fff0d8', 30, 10, Math.PI / 6, 0.9, 1.2); key.position.set(-1.6, 3.4, 3.2); key.target.position.set(0.05, 0.9, -0.1); key.castShadow = true; scene.add(key, key.target);
const fill2 = new THREE.SpotLight('#ffd9b0', 9, 8, Math.PI / 5, 1, 1.5); fill2.position.set(2.2, 1.6, 2.6); fill2.target.position.set(0, 0.9, 0); scene.add(fill2, fill2.target);


// ---------- camera: frontal, like sitting in front of a paper theatre; shallow focus on the puppets ----------
const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 30); camera.position.set(0.02, 1.16, 3.35); camera.lookAt(0.02, 1.16, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(RW, RH, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
key.shadow.mapSize.set(4096, 4096); key.shadow.bias = -0.0003; key.shadow.normalBias = 0.004; key.shadow.radius = 10;
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(RW, RH, { samples: 4, type: THREE.HalfFloatType })); composer.setSize(RW, RH); composer.addPass(new RenderPass(scene, camera));
/* no GTAO / Bokeh here: both render the paper as full rectangles (they ignore the cut-out alpha) and leave ghost boxes. Depth of field is painted into the far layers instead. */
composer.addPass(new OutputPass());
const out = document.getElementById('out'); out.width = RW; out.height = RH; const o = out.getContext('2d');

// ---------- animation: ?anim=lamb ----------
/* Clay/paper motion rules: puppets move on 2s, faces swap in one frame and hold, a paper hop when walking, one main event. */
const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x), seg = (t, a, b) => sm((t - a) / (b - a));
const HOLD_POOR = new THREE.Vector3(), HAND_RICH = new THREE.Vector3();
window.DURATION = 5.0; window.AUDIO = [27.4, 32.4];
window.POSE = (t0) => { const t = Q.get('anim') === 'lamb' ? Math.floor(t0 * 12) / 12 : (+Q.get('t') || 0), P = poor.userData.parts, R = rich.userData.parts;
  /* the rich man: looks back at his own flock, decides (one-frame face swap), hops left, takes the lamb by the scruff, hops back with it */
  const goL = seg(t, 1.84, 2.5), back = seg(t, 3.0, 3.8), x = 0.36 - 0.24 * goL + 0.2 * back;
  const hop = (goL > 0 && goL < 1) || (back > 0 && back < 1) ? Math.abs(Math.sin(t * Math.PI * 3)) * 0.012 : 0;
  rich.position.set(x, 0.3 + hop, 0); setHead(rich, t < 1.6 ? 0 : 1); R.head.rotation.z = t < 1.6 ? -0.12 : 0; R.armFar.rotation.z = 0.35;
  /* the poor man: holds the lamb; shock on the grab, reaches after it, then grief */
  const taken = t >= 2.95; setHead(poor, t < 2.95 ? 0 : t < 3.9 ? 1 : 2);
  const after = seg(t, 3.05, 3.45) * (1 - 0.35 * seg(t, 4.2, 4.7));
  P.armNear.rotation.z = 0.9 * after; P.armFar.rotation.z = 0.75 * after; P.head.rotation.z = -0.05 * after + 0.12 * seg(t, 4.2, 4.7); poor.position.set(-0.27 + 0.025 * after, 0.3, 0);
  stage.updateMatrixWorld(true);
  /* where the lamb sits on his arm, and the scruff on its back */
  const seat = P.armNear.localToWorld(LAMB_SEAT.clone()), scruff = seat.clone().add(new THREE.Vector3(0.0, 0.1, 0));
  /* the rich man's arm: hangs, then aims straight at the scruff (solved, not eyeballed), then lifts the lamb away */
  const sh = R.armNear.getWorldPosition(new THREE.Vector3()), aim = Math.atan2(scruff.y - sh.y, scruff.x - sh.x) - FIST_ANGLE;
  const reach = seg(t, 2.56, 2.92); let ang = 0.95 + (aim - 0.95) * reach; if (taken) ang = aim + (aim - 0.35 - aim) * seg(t, 3.0, 3.5);
  R.armNear.rotation.z = ang; stage.updateMatrixWorld(true);
  const fist = R.armNear.localToWorld(FIST.clone());
  if (!taken) { lamb.position.set(seat.x, seat.y, 0.007); lamb.rotation.z = 0; }
  else { const sw = back > 0 && back < 1 ? 0.18 * Math.sin(t * 9) : 0.06; lamb.rotation.z = sw; lamb.position.set(fist.x + Math.sin(sw) * 0.1, fist.y - 0.1 * Math.cos(sw), 0.032); }
  lambPieces[0].visible = !taken; lambPieces[1].visible = taken;
  window.GRAB = taken ? 0 : +fist.distanceTo(scruff).toFixed(3); /* how far the fist is from the scruff at the moment of the grab */
  return JSON.stringify([t, rich.position.x.toFixed(4), hop.toFixed(4)]);
};

/* paper checks: layers too close (z-fighting), puppet bottoms showing above the front strip, pieces cut by the frame edge */
window.QC = () => { stage.updateMatrixWorld(true); const issues = [], pieces = []; const shown = m => { for (let p = m; p; p = p.parent) if (!p.visible) return false; return true; }; stage.traverse(m => { if (m.isMesh && shown(m)) pieces.push(m); });
  const bx = pieces.map(m => new THREE.Box3().setFromObject(m)), z = pieces.map(m => m.getWorldPosition(new THREE.Vector3()).z);
  for (let i = 0; i < pieces.length; i++) for (let j = i + 1; j < pieces.length; j++) { const a = bx[i], b = bx[j]; if (a.max.x < b.min.x || b.max.x < a.min.x || a.max.y < b.min.y || b.max.y < a.min.y) continue; if (Math.abs(z[i] - z[j]) < 0.002) issues.push({ kind: 'z-fight', a: i, b: j, dz: +(z[i] - z[j]).toFixed(4) }); }
  for (const Pp of [poor, rich]) { const b = new THREE.Box3().setFromObject(Pp.userData.parts.body); if (b.min.y > FRONT_Y - 0.01) issues.push({ kind: 'bottom shows', who: Pp === poor ? 'poor' : 'rich', minY: +b.min.y.toFixed(3) }); }
  camera.updateMatrixWorld(); for (const Pp of [poor, rich, lamb]) { const b = new THREE.Box3().setFromObject(Pp), c = [b.min, b.max].map(v => v.clone().project(camera)); if (c[0].x < -1 || c[1].x > 1) issues.push({ kind: 'cut by frame', who: Pp === poor ? 'poor' : Pp === rich ? 'rich' : 'lamb', x: [c[0].x.toFixed(2), c[1].x.toFixed(2)] }); }
  return { hits: { issues, allowed: [] } }; };

window.drawFrame = (t = 0) => { window.POSE(t); composer.render(); o.drawImage(renderer.domElement, 0, 0, RW, RH);
  const g = o.createRadialGradient(RW / 2, RH / 2, RH * 0.3, RW / 2, RH / 2, RH * 0.8); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.4)'); o.fillStyle = g; o.fillRect(0, 0, RW, RH);
  return out.toDataURL('image/png'); };
